[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-os"
version = "0.1.0"
description = "Week 1 prototype for grounded industrial maintenance assistance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3,<4",
    "pgvector>=0.3,<1",
    "openai>=2,<3",
    "Pillow>=11,<13",
    "python-multipart>=0.0.18",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "httpx2>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*", "ingestion*", "evaluation*"]
exclude = ["sample_data*", "evaluation.results*"]

[tool.ruff]
line-length = 100
target-version = "py312"
